name: Build Finder for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Build Finder.exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all playwright --name Finder app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Finder-Windows
          path: dist/Finder.exe
          if-no-files-found: error
      - name: Create private release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" "dist/Finder.exe" --clobber
