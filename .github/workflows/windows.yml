name: Build Finder for Windows
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to upload Finder.exe to (e.g. v3.3.0); leave blank for build only'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: finder-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pillow
      - name: Check Python syntax
        shell: pwsh
        run: python -m compileall -q app.py core.py updater.py tools/make_icon.py test_proxy.py
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Generate Finder icon
        shell: pwsh
        run: python tools/make_icon.py
      - name: Build Finder.exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all playwright --icon assets/finder.ico --version-file assets/version_info.txt --name Finder app.py
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/Finder.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Finder.exe" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finder-Windows
          path: |
            dist/Finder.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish new version automatically
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionLine = Select-String -Path "updater.py" -Pattern '^VERSION\s*=\s*["'']([0-9]+\.[0-9]+\.[0-9]+)["'']\s*$' | Select-Object -First 1
          if (-not $versionLine) { throw "Cannot determine Finder version from updater.py" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $tag = "v$version"
          $repo = "${{ github.repository }}"
          gh release view "$tag" --repo "$repo" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; replacing outdated binaries."
            gh release upload "$tag" "dist/Finder.exe" "dist/SHA256SUMS.txt" --repo "$repo" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to update assets for $tag" }
            exit 0
          }
          Write-Host "Creating release $tag from commit ${{ github.sha }}"
          gh release create "$tag" "dist/Finder.exe" "dist/SHA256SUMS.txt" --repo "$repo" --target "${{ github.sha }}" --title "Finder $version" --notes "Finder $version Windows release. Includes Finder.exe and SHA-256 checksum." --latest
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed for $tag" }
      - name: Manually publish to selected existing release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag" }
          gh release view "$tag" --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Release $tag does not exist" }
          gh release upload "$tag" "dist/Finder.exe" "dist/SHA256SUMS.txt" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
